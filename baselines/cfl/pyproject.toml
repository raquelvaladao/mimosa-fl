[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfl-baseline"
version = "0.1.0"
description = "CFL baseline reproducing Sattler et al. (arXiv:1910.01991) with mimosa-fl"
license = { text = "Apache-2.0" }
dependencies = [
    "mimosa-fl>=0.1.0",
    "flwr[simulation]>=1.28.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "matplotlib>=3.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "mimosa-fl"
fab-format-version = 1
flwr-version-target = "1.33.0"

[tool.flwr.app.components]
serverapp = "experiment:app"
clientapp = "experiment:client_app"

[tool.flwr.app.config]
num-rounds = 50
num-clients = 100
num-clusters = 2
sample-fraction = 1.0
eps-1 = 0.5
eps-2 = 0.5
min-cluster-size = 5
max-tree-depth = 3
learning-rate = 0.1
batch-size = 32
local-epochs = 1
seed = 42
output-dir = "output"

[tool.flwr.federations]
local-sim = "flwr-simulation:fed@localhost"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimosa-fl"
version = "0.1.0"
description = "Clustered Federated Learning (CFL) framework built as a thin fork of Flower."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "mimosa-fl contributors" }]
keywords = ["federated learning", "clustering", "flower", "cfl", "multi-task learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "flwr>=1.28.0,<1.34.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "matplotlib>=3.7.0",
    "PyYAML>=6.0",
]
torch = ["torch>=2.1.0", "torchvision>=0.16.0"]

[project.scripts]
mimosa = "mimosa.cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["mimosa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
